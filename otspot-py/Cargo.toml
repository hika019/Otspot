[package]
name = "otspot-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Python bindings for otspot (PyO3 / maturin)"
publish = false

[lib]
name = "otspot"
crate-type = ["cdylib", "rlib"]

[dependencies]
otspot-core = { workspace = true }
otspot-model = { workspace = true }
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[dev-dependencies]
serde_json = "1"

[features]
default = ["extension-module"]
# maturin links this cdylib into a Python-loaded .so, which must NOT link
# libpython directly (the host interpreter provides those symbols at dlopen
# time). `cargo test`/`cargo nextest run -p otspot-py` need the opposite
# (a normal linked test binary), so CI and local Rust-side testing run with
# `--no-default-features` to get a directly-linked, testable build.
extension-module = ["pyo3/extension-module"]
